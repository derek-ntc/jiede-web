<form
  method="post"
  action="{{ url_for('create_assembly_shipment_from_shipped_page') }}"
  class="grid-form assembly-shipment-form"
  enctype="multipart/form-data"
  data-assembly-shipment-form
>
  <input type="hidden" name="operation_token" value="{{ assembly_operation_token }}">
  <script type="application/json" data-assembly-recipient-defaults>{{ recipient_defaults|tojson }}</script>
  <label>
    客户
    <select name="customer" required data-assembly-customer>
      <option value="">请选择客户</option>
      {% for customer in customers %}
        <option value="{{ customer }}">{{ customer }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    组装件图号
    <select name="assembly_drawing_no" required disabled data-assembly-drawing>
      <option value="">请先选择客户</option>
    </select>
  </label>
  <label>
    组装件套数
    <input type="number" name="set_quantity" min="1" step="1" required data-assembly-set-quantity>
  </label>
  <label>
    发货时间
    <input type="date" name="shipped_at" value="{{ default_shipped_at }}" required>
  </label>
  <label>
    发货图片
    <input type="file" name="images" accept="image/*" multiple>
  </label>
  <label class="wide">
    发货备注
    <input type="text" name="logistics_no" placeholder="可选">
  </label>
  <fieldset class="wide" data-assembly-recipient-fields hidden>
    <legend>本次收货资料</legend>
    <label>收货人<input name="recipient_name" maxlength="100"></label>
    <label>收货电话<input name="recipient_phone" maxlength="100"></label>
    <label>收货地址<input name="address" maxlength="1000"></label>
    <p class="empty-text">可留空；仅保存到本次送货单，不修改客户资料。</p>
  </fieldset>

  <div class="wide assembly-shipment-feedback">
    <p class="empty-text" aria-live="polite" data-assembly-status>请选择客户、组装件图号和套数后预览。</p>
    <div class="assembly-warning-summary" aria-live="polite" data-assembly-warning-summary></div>
  </div>

  <div class="wide">
    <p class="empty-text">删减和追加仅影响本次发货，不修改组装件配置。更换客户或图号会重置调整；修改套数保留实际数量。</p>
    <p class="empty-text">实际数量可填 0（本次不发），仍保留在送货单中；至少一个产品的数量须大于 0。本行备注最多 500 字。</p>
    <button type="button" class="secondary" data-assembly-recalculate>按当前套数重算已选 BOM 行数量</button>
  </div>

  <div class="wide table-wrap assembly-preview-wrap">
    <table class="assembly-preview-table">
      <thead>
        <tr>
          <th>配件图号</th>
          <th>产品名称</th>
          <th>规格型号</th>
          <th>来源</th>
          <th>每套用量</th>
          <th>计算数量</th>
          <th>实际发货数量</th>
          <th>本行备注</th>
          <th>订单分配</th>
          <th>库存状态</th>
          <th>本次调整</th>
        </tr>
      </thead>
      <tbody data-assembly-preview>
        <tr data-assembly-preview-empty>
          <td colspan="11" class="empty">暂无组装发货预览</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="wide">
    <label>添加产品（图号 / 名称）
      <input type="search" autocomplete="off" data-assembly-component-search placeholder="搜索当前客户的产品">
    </label>
    <p class="empty-text">每次追加 1 件，可修改数量；重复产品合并到已有行，备注保留。</p>
    <div aria-live="polite" data-assembly-component-results></div>
  </div>

  <div class="wide form-actions">
    <button type="submit" disabled data-assembly-submit>保存组装发货</button>
  </div>
</form>

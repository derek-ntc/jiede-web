{% extends "base.html" %}
{% block title %}库存调整{% endblock %}
{% block content %}
<div class="inventory-page inventory-mobile-page">
  <section class="page-head">
    <div>
      <h1>库存调整</h1>
      <p>盘点数量和系统库存有出入时，填写盘点后的实际数量，系统会按差额生成调整流水。</p>
    </div>
  </section>

  <nav class="inventory-tabs">
    <a href="{{ url_for('admin_inventory_overview') }}">库存总览</a>
    <a href="{{ url_for('inventory_scan') }}">扫码查询</a>
    <a href="{{ url_for('inventory_inbound') }}">扫码入库</a>
    <a href="{{ url_for('inventory_outbound') }}">扫码出库</a>
    <a class="active-nav-link" href="{{ url_for('inventory_adjust') }}">库存调整</a>
    <a href="{{ url_for('inventory_locations') }}">库位管理</a>
    <a href="{{ url_for('inventory_transactions') }}">库存流水</a>
  </nav>

  <section class="panel scanner-panel">
    <div id="inventory-reader"></div>
    <div class="mobile-action-row">
      <button type="button" data-start-scan>打开摄像头扫码</button>
      <button class="secondary" type="button" data-stop-scan>停止扫码</button>
    </div>
    <form class="inventory-code-form" data-inventory-select-form>
      <input type="search" name="code" placeholder="输入 SKU / 条码 / 库存编码" autocomplete="off">
      <button type="submit">选择产品</button>
    </form>
  </section>

  <section class="panel">
    <form method="post" class="grid-form inventory-form">
      <label class="wide">
        产品
        <select name="manual_id" data-inventory-product-select required>
          <option value="">请选择产品</option>
          {% for product in products %}
            <option value="{{ product.id }}" data-code="{{ inventory_code(product) }}" {% if selected_manual_id == product.id %}selected{% endif %}>
              {{ product.product_name }} / {{ product.drawing_no or "-" }} / {{ inventory_code(product) }}
            </option>
          {% endfor %}
        </select>
      </label>
      <label>
        调整库位
        <select name="location_id" required>
          {% for location in locations %}
            <option value="{{ location.id }}">{{ location.code }} / {{ location.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        盘点后实际数量
        <input type="number" name="counted_quantity" min="0" step="1" required>
      </label>
      <label class="wide">
        备注
        <textarea name="remark" rows="3" placeholder="例如：月末盘点，实物数量修正"></textarea>
      </label>
      <div class="wide form-actions">
        <button type="submit">确认调整</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="{{ url_for('static', filename='inventory.js', v=static_version) }}" defer></script>
{% endblock %}

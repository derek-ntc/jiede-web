{% extends "base.html" %}
{% block title %}新增产品订单{% endblock %}
{% block content %}
  <section class="page-head">
    <div>
      <h1>新增产品订单</h1>
      <p>一个订单可添加多个产品，客户名称按产品资料自动匹配。</p>
    </div>
    <div class="form-actions">
      <a class="button" href="{{ url_for('import_orders') }}">Excel导入订单</a>
      <a class="button secondary" href="{{ url_for('download_order_import_template') }}">下载Excel模板</a>
      <a class="button secondary" href="{{ url_for('admin_orders') }}">返回生产订单</a>
    </div>
  </section>

  <section class="panel">
    <form method="post" class="stack-form order-entry-form" data-order-entry>
      <div class="grid-form">
        <label>
          订单号
          <input type="text" name="order_no" required>
        </label>
        <label>
          下单时间
          <input type="date" name="ordered_at" value="{{ default_ordered_at }}" required>
        </label>
        <label>
          客户筛选
          <input type="text" list="order-customer-options" placeholder="输入或选择客户" data-order-customer-filter>
          <datalist id="order-customer-options">
            {% for customer in product_customers %}
              <option value="{{ customer }}"></option>
            {% endfor %}
          </datalist>
        </label>
      </div>

      <div class="table-wrap input-table-wrap">
        <table class="input-table">
          <thead>
            <tr>
              <th>产品图号</th>
              <th>产品名称</th>
              <th>客户名称</th>
              <th>订单数量</th>
              <th>计划发货时间</th>
              <th>材料库存情况</th>
              <th>备注</th>
              <th>纸箱情况</th>
              <th>最近发货</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody data-order-items>
            <tr data-order-item>
              <td data-label="产品图号">
                <select name="manual_id" data-product-select required>
                  <option value="" data-product-name="" data-customer="">请选择产品图号</option>
                  {% for product in products %}
                    <option value="{{ product.id }}" data-product-name="{{ product.product_name }}" data-customer="{{ product.customer or '' }}">
                      {{ product.drawing_no or "未填图号" }}
                    </option>
                  {% endfor %}
                </select>
              </td>
              <td data-label="产品名称" data-product-name-cell>-</td>
              <td data-label="客户名称" data-customer-name-cell>-</td>
              <td data-label="订单数量">
                <input type="number" name="quantity" min="1" step="1" required>
              </td>
              <td data-label="计划发货时间">
                <input type="date" name="planned_ship_at" required>
              </td>
              <td data-label="材料库存情况">
                <label class="inline-checkbox">
                  <input type="hidden" name="material_stock_status" value="">
                  <input type="checkbox" data-status-checkbox data-status-target="material_stock_status">
                  已确认
                </label>
              </td>
              <td data-label="备注">
                <input type="text" name="remark" placeholder="订单备注">
              </td>
              <td data-label="纸箱情况">
                <label class="inline-checkbox">
                  <input type="hidden" name="carton_status" value="">
                  <input type="checkbox" data-status-checkbox data-status-target="carton_status">
                  已确认
                </label>
              </td>
              <td data-label="最近发货">
                <label class="inline-checkbox">
                  <input type="hidden" name="recent_ship_status" value="">
                  <input type="checkbox" data-status-checkbox data-status-target="recent_ship_status">
                  已确认
                </label>
              </td>
              <td class="actions" data-label="操作">
                <button class="secondary" type="button" data-remove-row>删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="form-actions">
        <button class="secondary" type="button" data-add-row>添加产品</button>
        <button type="submit">保存订单</button>
      </div>
    </form>
  </section>
{% endblock %}
{% block scripts %}
  <script>
    (() => {
      const form = document.querySelector("[data-order-entry]");
      if (!form) return;

      const body = form.querySelector("[data-order-items]");
      const addButton = form.querySelector("[data-add-row]");
      const customerFilter = form.querySelector("[data-order-customer-filter]");

      function syncRow(row) {
        const select = row.querySelector("[data-product-select]");
        const option = select.selectedOptions[0];
        row.querySelector("[data-product-name-cell]").textContent = option?.dataset.productName || "-";
        row.querySelector("[data-customer-name-cell]").textContent = option?.dataset.customer || "-";
      }

      function activeCustomer() {
        return (customerFilter?.value || "").trim().toLowerCase();
      }

      function filterProductSelect(select) {
        const customer = activeCustomer();
        let selectedStillVisible = !customer || (select.selectedOptions[0]?.dataset.customer || "").toLowerCase().includes(customer);
        Array.from(select.options).forEach((option) => {
          if (!option.value) {
            option.hidden = false;
            option.disabled = false;
            return;
          }
          const matches = !customer || (option.dataset.customer || "").toLowerCase().includes(customer);
          option.hidden = !matches;
          option.disabled = !matches;
        });
        if (!selectedStillVisible) {
          select.value = "";
        }
      }

      function filterAllProductSelects() {
        body.querySelectorAll("[data-product-select]").forEach((select) => {
          filterProductSelect(select);
          syncRow(select.closest("[data-order-item]"));
        });
      }

      function updateRemoveState() {
        const rows = body.querySelectorAll("[data-order-item]");
        rows.forEach((row) => {
          row.querySelector("[data-remove-row]").disabled = rows.length === 1;
        });
      }

      body.addEventListener("change", (event) => {
        if (event.target.matches("[data-product-select]")) {
          syncRow(event.target.closest("[data-order-item]"));
        }
      });

      customerFilter?.addEventListener("input", filterAllProductSelects);
      customerFilter?.addEventListener("change", filterAllProductSelects);

      body.addEventListener("click", (event) => {
        if (!event.target.matches("[data-remove-row]")) return;
        event.target.closest("[data-order-item]").remove();
        updateRemoveState();
      });

      addButton.addEventListener("click", () => {
        const row = body.querySelector("[data-order-item]").cloneNode(true);
        row.querySelector("[data-product-select]").value = "";
        row.querySelectorAll("input").forEach((input) => {
          if (input.type === "checkbox") {
            input.checked = false;
          } else {
            input.value = "";
          }
        });
        syncRow(row);
        body.appendChild(row);
        filterProductSelect(row.querySelector("[data-product-select]"));
        updateRemoveState();
      });

      body.querySelectorAll("[data-order-item]").forEach(syncRow);
      filterAllProductSelects();
      updateRemoveState();

      form.addEventListener("submit", () => {
        body.querySelectorAll("[data-order-item]").forEach((row) => {
          row.querySelectorAll("[data-status-checkbox]").forEach((checkbox) => {
            const target = row.querySelector(`input[type="hidden"][name="${checkbox.dataset.statusTarget}"]`);
            if (target) {
              target.value = checkbox.checked ? "1" : "";
            }
          });
        });
      });
    })();
  </script>
{% endblock %}

{% extends "base.html" %}
{% block title %}新增产品订单{% endblock %}
{% block content %}
  <section class="page-head">
    <div>
      <h1>新增产品订单</h1>
      <p>一个订单可添加多个产品，可按产品图号或产品名称选择，客户名称按产品资料自动匹配。</p>
    </div>
    <div class="form-actions">
      <a class="button" href="{{ url_for('import_orders') }}">Excel导入订单</a>
      <a class="button secondary" href="{{ url_for('download_order_import_template') }}">下载Excel模板</a>
      <a class="button secondary" href="{{ url_for('admin_orders') }}">返回生产订单</a>
    </div>
  </section>

  <section class="panel">
    <form
      method="post"
      class="stack-form order-entry-form"
      data-order-entry
      data-assembly-options-url="{{ url_for('order_assembly_options') }}"
      data-assembly-definition-url="{{ url_for('order_assembly_definition') }}"
    >
      <div class="grid-form">
        <label>
          订单号
          <input type="text" name="order_no" required>
        </label>
        <label>
          下单时间
          <input type="date" name="ordered_at" value="{{ default_ordered_at }}" required>
        </label>
        <label>
          订单交货期（自动填入清单）
          <input type="date" data-order-delivery-date>
        </label>
        <label>
          客户
          <select name="customer" data-order-customer-filter required>
            <option value="">请选择客户</option>
            {% for customer in product_customers %}
              <option value="{{ customer }}">{{ customer }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div data-order-assemblies>
        <div class="grid-form" data-order-assembly-row>
          <label>
            组装图号（可选）
            <select name="assembly_drawing_no" data-order-assembly-drawing disabled>
              <option value="">先选择客户</option>
            </select>
          </label>
          <label>
            组装数量（套）
            <input type="number" name="assembly_set_quantity" min="1" max="2147483647" step="1" data-order-assembly-quantity disabled>
          </label>
          <div class="form-actions"><button class="secondary" type="button" data-remove-assembly disabled>删除组装图号</button></div>
        </div>
      </div>

      <div class="form-actions">
        <button class="secondary" type="button" data-add-assembly disabled>添加组装图号</button>
        <button class="secondary" type="button" data-generate-assembly-order disabled>生成配件清单</button>
        <span class="empty-text" data-assembly-order-status aria-live="polite">选择客户和组装图号后，可按套数自动生成配件数量。</span>
      </div>

      <div class="table-wrap input-table-wrap">
        <table class="input-table">
          <thead>
            <tr>
              <th>产品图号</th>
              <th>产品名称</th>
              <th>客户名称</th>
              <th>订单数量</th>
              <th>计划发货时间</th>
              <th>材料库存情况</th>
              <th>备注</th>
              <th>纸箱情况</th>
              <th>最近发货</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody data-order-items>
            <tr data-order-item>
              <td data-label="产品图号">
                <input type="hidden" name="item_assembly_drawing_no" value="">
                <small data-item-assembly-label></small>
                <select name="manual_id" data-product-select data-product-drawing-select required>
                  <option value="" data-product-name="" data-customer="">请选择产品图号</option>
                  {% for product in products %}
                    <option value="{{ product.id }}" data-product-name="{{ product.product_name }}" data-customer="{{ product.customer or '' }}" data-customers='{{ product.customers | tojson }}' data-drawing-no="{{ product.drawing_no or '' }}">
                      {{ product.drawing_no or "未填图号" }}
                    </option>
                  {% endfor %}
                </select>
              </td>
              <td data-label="产品名称">
                <select data-product-name-select required>
                  <option value="" data-product-name="" data-customer="">请选择产品名称</option>
                  {% for product in products %}
                    <option value="{{ product.id }}" data-product-name="{{ product.product_name }}" data-customer="{{ product.customer or '' }}" data-customers='{{ product.customers | tojson }}' data-drawing-no="{{ product.drawing_no or '' }}">
                      {{ product.product_name }} / {{ product.drawing_no or "未填图号" }}
                    </option>
                  {% endfor %}
                </select>
              </td>
              <td data-label="客户名称" data-customer-name-cell>-</td>
              <td data-label="订单数量">
                <input type="number" name="quantity" min="1" max="2147483647" step="1" required>
              </td>
              <td data-label="计划发货时间">
                <input type="date" name="planned_ship_at" required>
              </td>
              <td data-label="材料库存情况">
                <label class="inline-checkbox">
                  <input type="hidden" name="material_stock_status" value="">
                  <input type="checkbox" data-status-checkbox data-status-target="material_stock_status">
                  已确认
                </label>
              </td>
              <td data-label="备注">
                <input type="text" name="remark" placeholder="订单备注">
              </td>
              <td data-label="纸箱情况">
                <label class="inline-checkbox">
                  <input type="hidden" name="carton_status" value="">
                  <input type="checkbox" data-status-checkbox data-status-target="carton_status">
                  已确认
                </label>
              </td>
              <td data-label="最近发货">
                <label class="inline-checkbox">
                  <input type="hidden" name="recent_ship_status" value="">
                  <input type="checkbox" data-status-checkbox data-status-target="recent_ship_status">
                  已确认
                </label>
              </td>
              <td class="actions" data-label="操作">
                <button class="secondary" type="button" data-remove-row>删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="form-actions">
        <button class="secondary" type="button" data-add-row>添加产品</button>
        <button type="submit">保存订单</button>
      </div>
    </form>
  </section>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='order_entry.js', v=static_version) }}"></script>
{% endblock %}
